<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing ring -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Waiter Serving Tray / Cloche Emblem -->
  <!-- Cloche Handle Knob -->
  <circle cx="256" cy="148" r="18" fill="url(#goldGrad)"/>
  <!-- Cloche Dome -->
  <path d="M 144 260 C 144 176 368 176 368 260 Z" fill="#ffffff"/>
  <!-- Cloche Platter Base -->
  <rect x="116" y="268" width="280" height="20" rx="10" fill="url(#goldGrad)"/>
  
  <!-- Modern Captain Subtitle -->
  <text x="256" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Segoe UI', sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">CAPTAIN</text>
  <text x="256" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#93c5fd" text-anchor="middle" letter-spacing="6">INAMDAR</text>
</svg>